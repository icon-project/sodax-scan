name: New chain
description: Show messages from a new chain in the explorer (indexer, API and explorer).
title: "feat: add <chain> to the explorer"
labels: [new-chain]
body:
  - type: markdown
    attributes:
      value: |
        These are the answers `make add-chain` asks for (see [docs/add-new-network.md](https://github.com/icon-project/sodax-scan/blob/master/docs/add-new-network.md)). Fill in what you know; leave a field empty if it isn't decided yet.
        This repo is public. Never paste private keys, RPC URLs that carry an API key, or contract addresses that haven't been announced.
  - type: input
    id: chain
    attributes:
      label: Chain
      description: Display name and the lowercase key used across the code, e.g. "Hedera (hedera)".
    validations:
      required: true
  - type: input
    id: nid
    attributes:
      label: Network ID (nid)
      description: The chain's relay network ID, a positive integer.
  - type: dropdown
    id: chain-type
    attributes:
      label: Chain type
      description: A non-EVM chain needs its own handler in `indexer/src/chains/<chain>/`.
      options:
        - EVM (uses the existing EVM handler)
        - Non-EVM (needs a new handler)
    validations:
      required: true
  - type: dropdown
    id: payload
    attributes:
      label: Message payload
      description: Solana and Bitcoin, for example, keep only a hash on-chain, so the indexer fetches the payload from the relay.
      options:
        - Stored on-chain
        - Hashed on-chain, fetched from the relay
        - Not sure yet
  - type: input
    id: native-asset
    attributes:
      label: Native asset symbol
      description: Uppercase, e.g. HBAR.
  - type: textarea
    id: explorers
    attributes:
      label: Block explorer links
      description: The transaction URL prefix on mainnet and testnet. It must end in `/` (the tx hash is appended) or contain `{txHash}`.
  - type: textarea
    id: assets
    attributes:
      label: Asset manager and assets
      description: The AssetManager address on this chain and each asset's address, symbol and decimals. Write "not deployed yet" if the contracts aren't live.
  - type: input
    id: coingecko
    attributes:
      label: CoinGecko ID
      description: Gives the native asset a USD price in the explorer. Leave empty if it has none.
  - type: input
    id: logo
    attributes:
      label: Network logo
      description: A link to the logo (PNG or SVG). It becomes `explorer/public/images/network-<chain>.png`.
  - type: input
    id: parent
    attributes:
      label: Parent issue
      description: The cross-repo issue or Epic this belongs to (owner/repo#N), if any.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ] Messages from this chain show in the explorer with the right network name, logo and tx links
        - [ ]
    validations:
      required: true
